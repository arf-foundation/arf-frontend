name: Test Frontend

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Build @arf/ui
        # packages/ui's dist/ is gitignored (regenerated output) and nothing
        # else in this pipeline builds it -- without this, every subsequent
        # step that resolves the @arf/ui workspace package (jest, next build)
        # fails with "Module not found: Can't resolve '@arf/ui'", since its
        # package.json `main` points at ./dist/index.js. Only the esbuild JS
        # bundle matters here; the build script's CSS-copy sub-step reads
        # from a prior `next build`'s output, which doesn't exist yet at
        # this point in CI, and warns instead of failing -- harmless, since
        # the app's own Tailwind build never consumes @arf/ui's copied CSS.
        run: cd packages/ui && yarn build
      - name: Check if yarn.lock changed
        id: lockfile-check
        run: |
          git diff --quiet yarn.lock || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        if: steps.lockfile-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ARF_GITHUB_PAT }}
          commit-message: Update yarn.lock [skip ci]
          title: 'Update yarn.lock'
          body: |
            This PR updates `yarn.lock` after dependency changes.
            It was automatically generated by the CI workflow.
          branch: update-yarn-lock
          base: ${{ github.ref_name }}
          delete-branch: true
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test --coverage
      - name: Build
        run: yarn build
