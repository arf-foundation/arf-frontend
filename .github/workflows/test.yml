name: Test Frontend

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Check if yarn.lock changed
        id: lockfile-check
        run: |
          git diff --quiet yarn.lock || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        if: steps.lockfile-check.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.ARF_GITHUB_PAT }}
          commit-message: Update yarn.lock [skip ci]
          title: 'Update yarn.lock'
          body: |
            This PR updates `yarn.lock` after dependency changes.
            It was automatically generated by the CI workflow.
          branch: update-yarn-lock
          base: ${{ github.ref_name }}
          delete-branch: true
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test --coverage
      - name: Build
        run: yarn build
