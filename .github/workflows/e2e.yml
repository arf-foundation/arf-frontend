name: E2E

# Playwright + axe-core against a production build, in Chromium, Firefox and
# WebKit, desktop and phone width. Replaces the Replay QA app (2026-10-09).
# Third-party hosts are blocked by the suite, so this job needs no secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run end-to-end suite
        run: yarn e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
