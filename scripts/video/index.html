<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How ARF works</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=block" rel="stylesheet">
<style>
/* Site tokens (arf-frontend app/globals.css). Composition is 1600x900, rendered frame by frame. */
:root{--canvas:#faf9f7;--surface:#fff;--raised:#f5f4f1;--ink:#191816;--muted:#605c54;--line:rgba(25,24,22,.09);--line2:rgba(25,24,22,.16);
  --blue:#3358e8;--blue-deep:#2743c4;--purple:#7a4be0;--amber:#b7791f;--amber-bg:#fdf6e7;--red:#c2410c;--red-bg:#fdf0ea;--green:#1f7a4d;--green-bg:#ecf7f0;
  --req-fg:#fff;--pend-line:#e8c98a;--ref-line:#f0b8a0;--bad-ring:rgba(194,65,12,.15)}
/* ?theme=dark renders the variant for the site's .dark theme: its surfaces and text
   (app/globals.css .dark), with status colours lifted to stay legible on #0e0d12. */
:root[data-theme=dark]{--canvas:#0e0d12;--surface:#17161d;--raised:#1d1c25;--ink:#faf9f7;--muted:rgba(250,249,247,.64);--line:rgba(250,249,247,.10);--line2:rgba(250,249,247,.18);
  --blue-deep:#8ea1ff;--amber:#e7b354;--amber-bg:rgba(231,179,84,.14);--red:#f2875b;--red-bg:rgba(242,135,91,.14);--green:#4fc38f;--green-bg:rgba(79,195,143,.14);
  --req-fg:#0e0d12;--pend-line:rgba(231,179,84,.45);--ref-line:rgba(242,135,91,.45);--bad-ring:rgba(242,135,91,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
#frame{position:absolute;inset:0}
/* caption */
#cap{position:absolute;left:96px;top:84px;width:1060px;font-family:"Newsreader",Georgia,serif;font-size:50px;line-height:1.14;letter-spacing:-.01em;font-weight:400}
#cap span{display:block}
#sim{position:absolute;right:96px;top:94px;display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:9px 18px 9px 14px;font-size:18px;color:var(--muted)}
#sim i{width:9px;height:9px;border-radius:50%;background:var(--amber)}
/* lane */
#lane{position:absolute;left:96px;right:96px;top:290px;height:150px}
.node{position:absolute;top:0;height:150px;width:250px;border:1px solid var(--line2);background:var(--surface);border-radius:14px;padding:26px 24px}
.node .t{font-size:24px;font-weight:600}
.node .s{font-size:17px;color:var(--muted);margin-top:6px}
#agent{left:0}
#cluster{right:0;width:320px}
#vols{margin-top:14px;font-size:16px;color:var(--muted);display:flex;gap:12px}
#vols b{font-weight:500;color:var(--ink)}
#vols b.gone{color:var(--red);text-decoration:line-through}
#rail{position:absolute;left:250px;right:320px;top:74px;height:2px;background:var(--line2)}
/* the gate: the one memorable element */
#gate{position:absolute;left:50%;top:-34px;width:8px;height:150px;margin-left:-4px;border-radius:4px;background:linear-gradient(180deg,var(--blue),var(--purple))}
#gatelbl{position:absolute;left:50%;top:-74px;transform:translateX(-50%);font-size:18px;font-weight:600;color:var(--blue-deep);white-space:nowrap}
#state{position:absolute;left:50%;top:132px;transform:translateX(-50%);white-space:nowrap;font-size:19px;font-weight:600;padding:8px 16px;border-radius:10px;opacity:0}
.req{position:absolute;top:56px;height:38px;padding:0 16px;border-radius:19px;display:flex;align-items:center;font-size:17px;white-space:nowrap;background:var(--ink);color:var(--req-fg);opacity:0}
/* ledger */
#ledger{position:absolute;left:96px;right:96px;top:590px}
#ledger .h{font-size:18px;color:var(--muted);margin-bottom:16px;display:flex;justify-content:space-between}
#chain{display:flex;flex-wrap:wrap;align-items:center;row-gap:12px}
.blk{height:60px;min-width:0;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;opacity:0;flex:0 0 auto}
.blk .n{font-size:13px;color:var(--muted)}
.blk .e{font-size:14px;margin-top:4px;white-space:nowrap}
.blk.pend{background:var(--amber-bg);border-color:var(--pend-line)}
.blk.ref{background:var(--red-bg);border-color:var(--ref-line)}
.blk.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--bad-ring)}
.link{width:16px;height:2px;background:var(--line2);flex:0 0 auto;opacity:0}
#verdict{font-size:18px;font-weight:600}
/* progress dots: the content is a sequence */
#dots{position:absolute;right:96px;bottom:56px;display:flex;gap:10px}
#dots i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
#dots i.on{background:var(--blue)}
#prov{position:absolute;left:96px;bottom:50px;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div id="frame">
  <div id="cap"></div>
  <div id="sim"><i></i>Simulated ONTAP cluster</div>
  <div id="lane">
    <div class="node" id="agent"><div class="t">AI agent</div><div class="s">calls ONTAP MCP tools</div></div>
    <div id="rail"><div id="gate"></div><div id="gatelbl">ARF</div><div id="state"></div></div>
    <div class="node" id="cluster"><div class="t">ONTAP cluster</div><div class="s">simulated</div><div id="vols" class="mono"></div></div>
    <div class="req mono" id="r1"></div><div class="req mono" id="r2"></div>
  </div>
  <div id="ledger"><div class="h"><span>Signed, hash-chained record. Each attempt is written before it runs.</span><span id="verdict"></span></div><div id="chain"></div></div>
  <div id="prov">Recorded run, 3 Oct 2026. Every value shown comes from its output.</div>
  <div id="dots"></div>
</div>
<script src="data.js"></script>
<script>
document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light';
const A2 = window.RUN.act2, DUR = 30;
// Ledger order for the run, from proxy.py at c3ed234: every write call is execution_attempted + execution_outcome.
const LEDGER = [[5.0,'execution_attempted','delete_volume app_data',''],[9.0,'execution_outcome','pending approval','pend'],
  [13.4,'approval_resolved','storage admin',''],[15.2,'execution_attempted','delete_volume scratch',''],[15.9,'execution_outcome','pending: other volume','pend'],
  [18.2,'execution_attempted','delete_volume app_data',''],[20.4,'execution_outcome','completed',''],[23.6,'call_refused','delete_lun','ref']];
const BEATS = [
  [0, 'Your agent asks to delete', 'a production volume.'],
  [4.5, 'ARF records the attempt', 'before anything runs.'],
  [8.5, 'A delete waits for a person.', 'The agent cannot approve it.'],
  [13, 'The approval names app_data,', 'and only app_data.'],
  [17.5, 'It runs, then an independent', 'read confirms the result.'],
  [22, 'An action ARF cannot model', 'is refused, never forwarded.'],
  [26, 'Edit any record afterwards', 'and the chain shows it.'],
];
const $ = id => document.getElementById(id);
const chain = $('chain');
chain.insertAdjacentHTML('beforeend', `<div class="blk" data-t="0.3" data-i="lead"><div class="n mono">#0-1 create_snapshot</div><div class="e mono">earlier in the run</div></div>`);
LEDGER.forEach(([t, ev, what, k], i) => {
  chain.insertAdjacentHTML('beforeend', `<div class="link" data-t="${t}"></div>`);
  if (false) chain.insertAdjacentHTML('beforeend', `<div class="link" data-t="${t}"></div>`);
  chain.insertAdjacentHTML('beforeend', `<div class="blk ${k}" data-t="${t}" data-i="${i}"><div class="n mono">#${i + 2} ${what}</div><div class="e mono">${ev}</div></div>`);
});
BEATS.forEach(() => $('dots').insertAdjacentHTML('beforeend', '<i></i>'));
const vols = A2.volumes;
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - clamp(x), 3);
const LANE_W = 1408, GATE_X = (250 + (LANE_W - 320)) / 2;  // centre of the rail, in lane coordinates

function req(el, t, t0, text, stopAtGate, passAt, bounceAt) {
  // travels agent -> gate; optionally continues to the cluster or bounces back
  if (t < t0) { el.style.opacity = 0; return; }
  el.textContent = text;
  const w = el.offsetWidth, x0 = 250 - w / 2 + 40, xg = GATE_X - w - 10, x1 = LANE_W - 320 - w / 2;
  let x = x0 + (xg - x0) * ease((t - t0) / 1.4), o = clamp((t - t0) / 0.3);
  if (passAt != null && t > passAt) x = xg + (x1 - xg) * ease((t - passAt) / 1.3), o = 1 - clamp((t - passAt - 1.2) / 0.4);
  if (bounceAt != null && t > bounceAt) x = xg - (xg - x0) * ease((t - bounceAt) / 1.0), o = 1 - clamp((t - bounceAt - 0.8) / 0.3);
  el.style.left = x + 'px'; el.style.opacity = o;
}
function state(t) {
  const s = $('state'); let txt = '', bg = '', fg = '', o = 0;
  if (t >= 8.5 && t < 13) [txt, bg, fg] = ['Waiting for a storage admin', 'var(--amber-bg)', 'var(--amber)'];
  else if (t >= 15.4 && t < 17.3) [txt, bg, fg] = ['scratch: not covered, waiting', 'var(--amber-bg)', 'var(--amber)'];
  else if (t >= 19.6 && t < 22) [txt, bg, fg] = [`Done. Independent read: volume_present = ${A2.delete_done.verified.volume_present}`, 'var(--green-bg)', 'var(--green)'];
  else if (t >= 23.4 && t < 26) [txt, bg, fg] = [`Refused. Upstream calls: ${A2.refused_upstream}`, 'var(--red-bg)', 'var(--red)'];
  if (txt) { o = 1; s.textContent = txt; s.style.background = bg; s.style.color = fg; }
  s.style.opacity = o;
}
function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  let b = 0; BEATS.forEach((x, i) => { if (t >= x[0]) b = i; });
  const [bt, l1, l2] = BEATS[b], k = clamp((t - bt) / 0.5), next = b + 1 < BEATS.length ? BEATS[b + 1][0] : DUR;
  const cap = $('cap'); cap.innerHTML = `<span>${l1}</span><span>${l2}</span>`;
  cap.style.opacity = Math.min(k, clamp((next - t) / 0.35)); cap.style.transform = `translateY(${(1 - ease(k)) * 10}px)`;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === b));
  const r1 = $('r1'), r2 = $('r2');
  r2.style.opacity = 0;
  if (t < 13) req(r1, t, 0.8, 'delete_volume app_data', true, null, null);
  else if (t < 17.5) { req(r1, t, 99, '', true); req(r2, t, 13.9, 'delete_volume scratch', true, null, 16.6); }
  else if (t < 22) req(r1, t, 17.6, 'delete_volume app_data', true, 18.6, null);
  else if (t < 26) req(r1, t, 22.2, 'delete_lun', true, null, 24.4);
  else r1.style.opacity = 0;
  state(t);
  $('vols').innerHTML = vols.map(v => `<b class="${v === 'app_data' && t >= 19.4 && t < 29.6 ? 'gone' : ''}">${v}</b>`).join('');
  document.querySelectorAll('#chain [data-t]').forEach(el => {
    const t0 = +el.dataset.t; el.style.opacity = t < t0 ? 0 : clamp((t - t0) / 0.35);
    if (el.dataset.i === 'lead') el.classList.toggle('bad', t >= 27.2 && t < 29.6);
  });
  const v = $('verdict');
  if (t >= 26.4 && t < 27.2) { v.textContent = `Chain verifies: ${A2.chain_entries} entries`; v.style.color = 'var(--green)'; }
  else if (t >= 27.2 && t < 29.7) { v.textContent = 'Entry #0 edited: refused, its hash no longer matches'; v.style.color = 'var(--red)'; }
  else v.textContent = '';
  // fade the whole frame at the loop seam
  $('frame').style.opacity = Math.min(clamp(t / 0.4), clamp((DUR - t) / 0.4));
}
window.render = render; window.DURATION = DUR;
render(+(new URLSearchParams(location.search).get('t') || 0));
</script>
</body>
</html>
